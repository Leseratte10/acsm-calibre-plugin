name: Build binaries

on:
  push:
  pull_request:
    branches: [ master, bytebooks ]

jobs: 
  build:
    runs-on: ubuntu-26.04
    steps: 
      - uses: actions/checkout@v7

      - name: Install compilers
        run: |
          sudo apt update
          sudo apt install -y gcc-mingw-w64-i686 gcc-mingw-w64-x86-64
          sudo apt install -y wget make zip

      - name: Compile
        run: |
          ./bundle_calibre_plugin.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with: 
          name: calibre-plugins
          compression-level: 0
          path: |
            calibre-plugin.zip

  test-python:
    runs-on: ubuntu-26.04
    container: python:${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["2.7", "3.5", "3.6", "3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"] 
    steps:
      - uses: actions/checkout@v7
      - name: Install python requirements
        run: |
          pip --no-python-version-warning install https://github.com/Leseratte10/acsm-calibre-plugin/releases/download/config/oscrypto_1.3.0_fork_2023-12-19.zip
          pip --no-python-version-warning install -r ./.github/workflows/ci_test_requirements.txt

      - name: Run tests
        run: |
          cd tests && python --version && PYTHONWARNINGS=ignore python ./main.py && cd ..
          python -m unittest discover -s calibre-plugin/customcrypto/tests -t calibre-plugin/customcrypto

  test-coverage:
    runs-on: ubuntu-26.04
    container: python:3.15
    steps:
      - uses: actions/checkout@v7
      - name: Install python requirements
        run: |
          pip --no-python-version-warning install -r ./.github/workflows/ci_test_requirements.txt

      - name: Run coverage tests
        run: |
          python --version
          python -m coverage erase
          python -m coverage run ./tests/main.py
          python -m coverage report


  test-ubuntu-2004:
    runs-on: ubuntu-26.04
    container: ubuntu:focal
    steps: 
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt update && apt install -y curl python3 python3-pip python2
          pip3 install -r ./.github/workflows/ci_test_requirements.txt
          # Install Python2 stuff
          curl https://bootstrap.pypa.io/pip/2.7/get-pip.py --output get-pip.py
          python2 get-pip.py
          pip2 --no-python-version-warning install -r ./.github/workflows/ci_test_requirements.txt

      - name: Run tests (Python 3)
        run: |
          cd tests && python3 ./main.py && cd ..
          python3 -m unittest discover -s calibre-plugin/customcrypto/tests -t calibre-plugin/customcrypto

      - name: Run tests (Python 2)
        run: |
          cd tests && PYTHONWARNINGS=ignore python2 ./main.py && cd ..
          python2 -m unittest discover -s calibre-plugin/customcrypto/tests -t calibre-plugin/customcrypto


  test-ubuntu-2604arm:
    runs-on: ubuntu-26.04-arm
    steps: 
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          apt update && apt install -y curl python3 python3-pip
          pip3 install -r ./.github/workflows/ci_test_requirements.txt

      - name: Run tests (Python 3)
        run: |
          cd tests && python3 ./main.py && cd ..
          python3 -m unittest discover -s calibre-plugin/customcrypto/tests -t calibre-plugin/customcrypto


  test-windows:
    runs-on: windows-2025
    steps: 
      - uses: actions/checkout@v7
      
      - name: Install dependencies
        run: |
          # Require cryptography >= 3.1 because in 3.0 and below, the backend param in load_key_and_certificates was still required.
          pip3 install -r ./.github/workflows/ci_test_requirements.txt
        shell: bash

      - name: Run tests (Python 3)
        run: |
          cd tests && python3 ./main.py && cd ..
          python3 -m unittest discover -s calibre-plugin/customcrypto/tests -t calibre-plugin/customcrypto
        shell: bash


  test-mac-arm64:
    runs-on: macos-26
    steps: 
      - uses: actions/checkout@v7
      
      - name: Install dependencies
        run: |
          pip3 install --break-system-packages -r ./.github/workflows/ci_test_requirements.txt

      - name: Run tests (Python 3)
        run: |
          cd tests && python3 ./main.py && cd ..
          python3 -m unittest discover -s calibre-plugin/customcrypto/tests -t calibre-plugin/customcrypto

  test-mac-intel:
    runs-on: macos-15-intel
    steps: 
      - uses: actions/checkout@v7
      
      - name: Install dependencies
        run: |
          pip3 install --break-system-packages -r ./.github/workflows/ci_test_requirements.txt

      - name: Run tests (Python 3)
        run: |
          cd tests && python3 ./main.py && cd ..
          python3 -m unittest discover -s calibre-plugin/customcrypto/tests -t calibre-plugin/customcrypto
